name: Sync app release
# Каждые 30 минут сверяет последний выпуск приложения и обновляет ссылки скачивания сайта.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Update product.json from the latest release
        run: python3 scripts/sync_release.py
      - name: Rebuild pages and run tests
        run: |
          python3 scripts/build.py
          python3 -m unittest discover -s tests -p "test_build.py"
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Sync site with the latest app release"
            git push
          fi
